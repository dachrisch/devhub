# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "🐳🧪 Test Docker Image"

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        description: Name of the artifact containing the Docker image tar
        type: string
      image_name:
        required: true
        description: Local name of the Docker image (matches the tar filename)
        type: string
      env_vars:
        required: false
        description: Space-separated "-e KEY=VALUE" pairs passed to docker run
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Download Docker image artifact"
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp

      - name: "🐳 Load Docker image"
        run: |
          docker load --input /tmp/${{ inputs.image_name }}.tar
          docker image ls -a

      - name: "🐳🧪 Test Docker image starts and responds"
        run: |
          docker run --rm --detach --name test_container \
            --add-host=host.docker.internal:host-gateway \
            ${{ inputs.env_vars }} \
            ${{ inputs.image_name }}:latest
          echo "Waiting for container to start..."
          sleep 10
          # Check container is running
          status=$(docker inspect --format='{{.State.Status}}' test_container)
          echo "Container status: $status"
          if [ "$status" != "running" ]; then
            echo "❌ Container is not running."
            docker logs test_container
            exit 1
          fi
          # Install curl and test HTTP response
          docker exec test_container sh -c "apk add --no-cache curl > /dev/null 2>&1"
          http_code=$(docker exec test_container sh -c "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/auth/me || echo '000'")
          echo "HTTP response code: $http_code"
          if [ "$http_code" = "000" ]; then
            echo "❌ Container is not responding on port 3000."
            docker logs test_container
            exit 1
          fi
          echo "✅ Container is running and responding (HTTP $http_code)"
          docker stop test_container
