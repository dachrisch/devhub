# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "🏗️🧪🚀 Build, Test and Deploy"

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  checks: write
  security-events: write

concurrency:
  group: build-test-deploy
  cancel-in-progress: true

jobs:
  node-build:
    uses: ./.github/workflows/part_node_build.yaml

  docker-image:
    needs: [node-build]
    uses: ./.github/workflows/part_docker_build.yaml
    with:
      image_name: devhub

  image-test:
    needs: [docker-image]
    uses: ./.github/workflows/part_docker_test.yaml
    with:
      artifact_name: ${{ needs.docker-image.outputs.artifact_name }}
      image_name: devhub
      env_vars: >-
        -e NODE_ENV=production
        -e DEVHUB_DB=/tmp/devhub-test.db

  image-push:
    needs: [docker-image, image-test]
    secrets: inherit
    uses: ./.github/workflows/part_docker_push_artifact.yaml
    with:
      artifact_name: ${{ needs.docker-image.outputs.artifact_name }}
      image_name: dachrisch/devhub
      local_image_name: devhub
